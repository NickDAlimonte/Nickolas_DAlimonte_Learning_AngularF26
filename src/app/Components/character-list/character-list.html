<h1>My Character list</h1>

<ul>
@for(character of characterList; track character.id){

  <app-character-list-item
    [character]="character"
    [class.even]="$even"
    [class.odd]="$odd"
    [first]="$first"
    [last]="$last"
    [listSize]="$count"
    (clicked)="onCharacterClicked($event)"
  />
}@empty{
  <h1>There is nothing to display here!</h1>
}
</ul>
